services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: cms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cms:cms@postgres:5432/cms?schema=public
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: cms-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      API_URL: http://api:4000/api
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
